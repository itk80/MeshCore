; Generic ESP32 TCPRadio variant — works on any ESP32 family chip with Wi-Fi.
; The on-board LoRa radio (if any) is NOT used; this firmware tunnels mesh::Radio
; operations to a remote pymc_usb modem over TCP.
;
; Two envs provided:
;   - Generic_ESP32_tcpradio_repeater    : classic ESP32 (esp32dev)
;   - Generic_ESP32S3_tcpradio_repeater  : ESP32-S3 (esp32-s3-devkitc-1)
;
; Set WIFI_PWD (and optionally WIFI_SSID, MODEM_DEFAULT_HOST) via
; `PLATFORMIO_BUILD_FLAGS` env var:
;
;   PLATFORMIO_BUILD_FLAGS='-D WIFI_PWD=\"mypwd\"' pio run -e Generic_ESP32_tcpradio_repeater -t upload

[Generic_esp32_tcpradio_base]
extends = esp32_base
build_flags =
  ${esp32_base.build_flags}
  -I variants/generic_esp32_tcpradio
  -D TCPRADIO=1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/generic_esp32_tcpradio>
  +<helpers/tcpradio/*.cpp>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}

[env:Generic_ESP32_tcpradio_repeater]
extends = Generic_esp32_tcpradio_base
board = esp32dev
build_flags =
  ${Generic_esp32_tcpradio_base.build_flags}
  -D ADVERT_NAME='"TCPRadio Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D MODEM_DEFAULT_HOST='"192.168.5.2"'
  -D MODEM_DEFAULT_PORT=5055
  -D WIFI_SSID='"_AP_SH_M"'
build_src_filter = ${Generic_esp32_tcpradio_base.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${Generic_esp32_tcpradio_base.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:Generic_ESP32S3_tcpradio_repeater]
extends = Generic_esp32_tcpradio_base
board = esp32-s3-devkitc-1
build_flags =
  ${Generic_esp32_tcpradio_base.build_flags}
  -D ADVERT_NAME='"TCPRadio Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D MODEM_DEFAULT_HOST='"192.168.5.2"'
  -D MODEM_DEFAULT_PORT=5055
  -D WIFI_SSID='"_AP_SH_M"'
build_src_filter = ${Generic_esp32_tcpradio_base.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${Generic_esp32_tcpradio_base.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0
