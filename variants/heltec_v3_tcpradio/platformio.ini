; Heltec V3 board, but the on-board SX1262 is unused — the MCU only drives
; Wi-Fi and tunnels mesh::Radio operations to a remote pymc_usb modem over TCP.
;
; Set WIFI_PWD (and optionally WIFI_SSID, MODEM_DEFAULT_HOST) in
; `platformio.local.ini` before flashing:
;
;   [env:Heltec_v3_tcpradio_repeater]
;   build_flags = ${env:Heltec_v3_tcpradio_repeater.build_flags}
;     -U WIFI_PWD -D WIFI_PWD='"my-real-password"'

[Heltec_v3_tcpradio_base]
extends = esp32_base
board = esp32-s3-devkitc-1
build_flags =
  ${esp32_base.build_flags}
  -I variants/heltec_v3_tcpradio
  -I variants/heltec_v3
  -D HELTEC_LORA_V3
  -D ESP32_CPU_FREQ=80
  -D PIN_BOARD_SDA=17
  -D PIN_BOARD_SCL=18
  -D PIN_USER_BTN=0
  -D PIN_VEXT_EN=36
  -D TCPRADIO=1
  ; HeltecV3Board.h references these pins for deep-sleep wakeup config even
  ; though we never drive an on-board SX1262. Same numbers as the stock
  ; Heltec_v3 variant so the board behaves identically wrt sleep/GPIO holds.
  -D P_LORA_NSS=8
  -D P_LORA_DIO_1=14
  -D P_LORA_RESET=RADIOLIB_NC
  -D P_LORA_BUSY=13
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/heltec_v3_tcpradio>
  +<helpers/tcpradio/*.cpp>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}

[env:Heltec_v3_tcpradio_repeater]
extends = Heltec_v3_tcpradio_base
build_flags =
  ${Heltec_v3_tcpradio_base.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"TCPRadio Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D MODEM_DEFAULT_HOST='"192.168.5.11"'
  -D MODEM_DEFAULT_PORT=5055
  -D WIFI_SSID='"_AP_SH_M"'
  ; WIFI_PWD intentionally not set — define it in platformio.local.ini:
  ;   [env:Heltec_v3_tcpradio_repeater]
  ;   build_flags = -D WIFI_PWD='"your-pwd"'
build_src_filter = ${Heltec_v3_tcpradio_base.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${Heltec_v3_tcpradio_base.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0
  adafruit/Adafruit SSD1306 @ ^2.5.13
